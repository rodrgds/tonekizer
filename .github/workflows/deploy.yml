name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tonekizer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run db:local
      - name: Test the frontend and local API
        run: |
          npm run dev > /tmp/tonekizer-dev.log 2>&1 &
          trap 'kill $!' EXIT
          curl --retry 20 --retry-all-errors --retry-delay 1 --fail --silent http://localhost:8788/api/leaderboard
          npm test
      - name: Deploy production
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 1e84f0262ece6e76da6df50801960036
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Add the CLOUDFLARE_API_TOKEN repository secret with Cloudflare Pages Edit permission to enable deployment.'
            exit 1
          fi
          npx wrangler pages deploy dist --project-name=tonekizer --branch=main
