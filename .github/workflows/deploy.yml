name: Check changes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tonekizer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run db:local
      - name: Test the frontend and local API
        run: |
          npm run dev > /tmp/tonekizer-dev.log 2>&1 &
          trap 'kill $!' EXIT
          curl --retry 20 --retry-all-errors --retry-delay 1 --fail --silent http://localhost:8788/api/leaderboard
          npm test
